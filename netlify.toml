[build]
command = "yarn build"
publish = "dist"

[build.environment]
NODE_VERSION = "18"
YARN_VERSION = "1.22.22"

# Ensure proper headers for JavaScript modules
[[headers]]
for = "/*.js"
[headers.values]
Content-Type = "text/javascript"

[[headers]]
for = "/assets/*.js"
[headers.values]
Content-Type = "text/javascript"
