<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27407c" />
      <stop offset="1" stop-color="#121f3f" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a8dfb" />
      <stop offset="1" stop-color="#2f6bed" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)" />

  <!-- Left: wordmark + headline -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="80" y="208" font-size="30" font-weight="700" fill="#9fb4e8" letter-spacing="6">ICJIA</text>
    <text x="76" y="312" font-size="82" font-weight="800" fill="#ffffff">QR Code</text>
    <text x="76" y="398" font-size="82" font-weight="800" fill="#ffffff">Generator</text>
    <text x="80" y="462" font-size="27" fill="#c7d3ee">Free, accessible QR codes for any URL.</text>
    <text x="80" y="540" font-size="27" font-weight="700" fill="#ffffff">qr.icjia.cloud</text>
  </g>

  <!-- Right: stylized QR card with a center ICJIA mark -->
  <g transform="translate(772 135)">
    <rect width="356" height="356" rx="28" fill="#ffffff" />
    <g transform="translate(38 38)" fill="#23356a">
      <!-- finder pattern: top-left -->
      <rect x="0" y="0" width="70" height="70" />
      <rect x="12" y="12" width="46" height="46" fill="#ffffff" />
      <rect x="22" y="22" width="26" height="26" fill="#23356a" />
      <!-- finder pattern: top-right -->
      <rect x="210" y="0" width="70" height="70" />
      <rect x="222" y="12" width="46" height="46" fill="#ffffff" />
      <rect x="232" y="22" width="26" height="26" fill="#23356a" />
      <!-- finder pattern: bottom-left -->
      <rect x="0" y="210" width="70" height="70" />
      <rect x="12" y="222" width="46" height="46" fill="#ffffff" />
      <rect x="22" y="232" width="26" height="26" fill="#23356a" />

      <!-- scattered data modules (14px on a 20px grid) -->
      <g fill="#23356a">
        <rect x="100" y="0" width="14" height="14" />
        <rect x="140" y="0" width="14" height="14" />
        <rect x="180" y="20" width="14" height="14" />
        <rect x="120" y="20" width="14" height="14" />
        <rect x="100" y="40" width="14" height="14" />
        <rect x="160" y="40" width="14" height="14" />
        <rect x="0" y="100" width="14" height="14" />
        <rect x="20" y="100" width="14" height="14" />
        <rect x="40" y="120" width="14" height="14" />
        <rect x="0" y="140" width="14" height="14" />
        <rect x="20" y="160" width="14" height="14" />
        <rect x="60" y="100" width="14" height="14" />
        <rect x="220" y="100" width="14" height="14" />
        <rect x="260" y="120" width="14" height="14" />
        <rect x="240" y="140" width="14" height="14" />
        <rect x="266" y="160" width="14" height="14" />
        <rect x="220" y="180" width="14" height="14" />
        <rect x="100" y="266" width="14" height="14" />
        <rect x="140" y="266" width="14" height="14" />
        <rect x="180" y="246" width="14" height="14" />
        <rect x="120" y="246" width="14" height="14" />
        <rect x="200" y="266" width="14" height="14" />
        <rect x="240" y="246" width="14" height="14" />
        <rect x="266" y="266" width="14" height="14" />
      </g>

      <!-- center ICJIA mark (the logo-in-center feature) -->
      <rect x="104" y="104" width="72" height="72" rx="12" fill="#23356a" />
      <text x="140" y="148" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">ICJIA</text>
    </g>
  </g>
</svg>
